name = "ims3310-helper"
main = "src/index.js"
compatibility_date = "2026-11-01"
# Serve at https://ims3310-helper.<subdomain>.workers.dev, with no extra per-version preview addresses.
workers_dev = true
preview_urls = false

[vars]
# Pages allowed to call this helper (comma-separated, no trailing slash).
ALLOWED_ORIGINS = "https://wen-tan.com,https://www.wen-tan.com,https://xiao-wen-tan.github.io"
# Claude model and effort. claude-sonnet-5 costs about 40% and claude-haiku-4-5 about 20%
# of claude-opus-5 per question (Haiku ignores EFFORT). See README.md for a cost example.
MODEL = "claude-opus-5"
EFFORT = "low"
# Where office-hours bookings are emailed. Must match destination_address in [[send_email]] below,
# written in lower case, because Cloudflare stores the verified address in lower case.
OFFICE_HOURS_TO = "xiaowen.tan@utdallas.edu"

# "News this week" stories: Sundays and Wednesdays at 13:00 UTC (7-8 AM Central), each covering the
# past 7 days. Cloudflare counts weekdays from 1 = Sunday, so day names are used to avoid mistakes.
# Discussion board: 0, 13, 14 and 23 UTC every day. The server converts to US Central time and acts
# only on Monday 8 AM (open), Wednesday 6 PM (nudge) and Friday 6 PM (summary), in summer and winter
# time alike. The second entry must match BOARD_CRON in src/index.js.
[triggers]
crons = ["0 13 * * SUN,WED", "0 0,13,14,23 * * *"]

# At most 5 requests per minute from one network address.
[[ratelimits]]
name = "ASK_LIMITER"
namespace_id = "3310"
simple = { limit = 5, period = 60 }

# Anonymous question log (Cloudflare D1). Create it with
#   npx wrangler d1 create ims3310-log
# then paste the database_id it prints below. See README.md, step 5.
[[d1_databases]]
binding = "DB"
database_name = "ims3310-log"
database_id = "1040c70c-1193-4468-8f60-ad4b0995f999"

# Office-hours booking emails (Cloudflare Email Routing). Before this works, in the Cloudflare
# dashboard: turn on Email Routing for wen-tan.com and verify Xiaowen.Tan@utdallas.edu as a
# destination address. The sender is office-hours@wen-tan.com (public_config.json).
[[send_email]]
name = "EMAIL"
destination_address = "xiaowen.tan@utdallas.edu"
